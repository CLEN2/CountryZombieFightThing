
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>197 Flags vs Endless Zombies</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;color:#fff;font-family:Arial,sans-serif}
body{display:flex;flex-direction:column;user-select:none;-webkit-user-select:none}
#top{flex:0 0 auto;min-height:42px;padding:6px 10px;background:#172631;display:flex;align-items:center;justify-content:space-between;gap:8px}
#title{font-size:clamp(11px,2.5vw,17px);font-weight:900}
#stats{font-size:clamp(9px,1.8vw,13px);text-align:right;color:#dcebf3}
#arena{position:relative;flex:1;min-height:0;overflow:hidden;background:#172b3b}
canvas{display:block;width:100%;height:100%;touch-action:pan-y}
#notice{position:absolute;top:7px;left:50%;transform:translateX(-50%);z-index:2;background:#071019dd;padding:5px 9px;border-radius:7px;font-size:clamp(9px,2vw,12px);white-space:nowrap;pointer-events:none}
#banner{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;font-size:clamp(24px,6vw,48px);font-weight:900;text-shadow:0 3px 8px #000;pointer-events:none;white-space:nowrap}
#subbanner{font-size:clamp(11px,2.5vw,17px);color:#fff0a4;margin-top:6px}
#bottom{flex:0 0 auto;background:#172631;display:flex;flex-direction:column;max-height:30%;min-height:94px}
#controls{display:flex;justify-content:center;align-items:center;gap:6px;padding:7px 4px;flex-wrap:wrap}
button{border:0;border-radius:7px;padding:9px 11px;background:#2b495a;color:white;font-weight:bold;font-size:clamp(10px,2vw,13px);min-height:35px;touch-action:manipulation}
button:active{filter:brightness(1.35);transform:scale(.97)}
#pause{background:#946b20}
#deadTitle{font-size:11px;font-weight:bold;color:#ffb6b6;padding:2px 8px}
#deadList{display:flex;flex-wrap:wrap;gap:4px;overflow:auto;padding:4px 7px 7px;min-height:0;font-size:10px}
.dead{display:flex;align-items:center;gap:4px;background:#39272a;border:1px solid #704046;border-radius:4px;padding:3px 5px}
.dead img{width:17px;height:12px;object-fit:contain}
@media(max-width:500px){
 #top{padding:5px 7px}
 #controls{gap:4px;padding:5px 3px}
 button{padding:8px 7px;min-height:34px}
 #bottom{max-height:34%;min-height:105px}
}
</style>
</head>
<body>
<div id="top">
 <div id="title">🌍 FLAGS vs ZOMBIES</div>
 <div id="stats">Loading...</div>
</div>
<div id="arena">
 <canvas id="game"></canvas>
 <div id="notice">🛡️ PREPARATION PHASE</div>
 <div id="banner">GET READY!<div id="subbanner">Horde arrives in 10</div></div>
</div>
<div id="bottom">
 <div id="controls">
  <button id="restart">↻ Restart</button>
  <button id="pause">⏸ Pause</button>
  <button id="sound">🔊 Sound ON</button>
  <button id="fullscreen">⛶ Fullscreen</button>
 </div>
 <div id="deadTitle">☠ FALLEN FLAGS (0)</div>
 <div id="deadList">No flags have fallen yet!</div>
</div>
<script>
"use strict";

const countries = [

["Antigua and Barbuda","ag"],["Argentina","ar"],["Armenia","am"],["Australia","au"],["Austria","at"],

["Latvia","lv"],["Lebanon","lb"],["Lesotho","ls"],["Liberia","lr"],["Libya","ly"],

["Myanmar","mm"],["Namibia","na"],["Nauru","nr"],["Nepal","np"],["Netherlands","nl"],
["New Zealand","nz"],["Nicaragua","ni"],["Niger","ne"],["Nigeria","ng"],["North Korea","kp"],

["Sao Tome and Principe","st"],["Saudi Arabia","sa"],["Senegal","sn"],["Serbia","rs"],
["Seychelles","sc"],["Sierra Leone","sl"],["Singapore","sg"],["Slovakia","sk"],
["Slovenia","si"],["Solomon Islands","sb"],["Somalia","so"],["South Africa","za"],
["South Korea","kr"],["South Sudan","ss"],["Spain","es"],["Sri Lanka","lk"],["Sudan","sd"],
["Suriname","sr"],["Sweden","se"],["Switzerland","ch"],["Syria","sy"],["Taiwan","tw"],
["Tajikistan","tj"],["Tanzania","tz"],["Thailand","th"],["Timor-Leste","tl"],["Togo","tg"],
["Tonga","to"],["Trinidad and Tobago","tt"],["Tunisia","tn"],["Turkey","tr"],["Turkmenistan","tm"],
["Tuvalu","tv"],["Uganda","ug"],["Ukraine","ua"],["United Arab Emirates","ae"],
["United Kingdom","gb"],["United States","us"],["Uruguay","uy"],["Uzbekistan","uz"],
["Vanuatu","vu"],["Vatican City","va"],["Venezuela","ve"],["Vietnam","vn"],["Yemen","ye"],
["Zambia","zm"],["Zimbabwe","zw"],["Western Sahara","eh"]
];

const $=id=>document.getElementById(id);
const arena=$("arena"),canvas=$("game"),ctx=canvas.getContext("2d",{alpha:false});
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const rand=(a,b)=>a+Math.random()*(b-a);
const mobile=()=>matchMedia("(max-width:700px)").matches;

let W=1,H=1,dpr=1;
let flags=[],zombies=[],bullets=[],flagImages={};
let running=false,paused=false,started=false,muted=false,gameOver=false;
let countdown=10,countClock=0,lastTime=0,spawnClock=0,waveClock=0;
let wave=1,defeated=0,nextId=1,shotClock=0,statsClock=0;
let audio=null,master=null,resizeObserver=null;
let lastBannerTimer=0;

function resize(){
 const r=arena.getBoundingClientRect();
 W=Math.max(1,r.width);H=Math.max(1,r.height);
 // Avoid rendering at unnecessarily huge device-pixel ratios.
 dpr=Math.min(window.devicePixelRatio||1,mobile()?1.35:1.75);
 canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);
 canvas.style.width=W+"px";canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 setTargets();
}
if("ResizeObserver" in window){
 resizeObserver=new ResizeObserver(resize);
 resizeObserver.observe(arena);
}
window.addEventListener("resize",resize);

function setupAudio(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC)return;
 if(!audio){
  audio=new AC();master=audio.createGain();
  master.gain.value=mobile()?.65:.9;
  master.connect(audio.destination);
 }
 if(audio.state==="suspended")audio.resume().catch(()=>{});
}
function tone(freq,dur,vol,type="triangle",end=0){
 if(muted||!audio||!master)return;
 try{
  const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(end)o.frequency.exponentialRampToValueAtTime(Math.max(1,end),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.01);
 }catch(e){}
}

function getBounds(){
 return {minX:4,maxX:Math.max(5,W-28),minY:18,maxY:Math.max(20,H*.64-20)};
}
function setTargets(){
 const b=getBounds(),left=W*.38,right=Math.max(left+10,W-30);
 const top=22,bottom=Math.max(top+10,H*.62-22);
 const cols=Math.max(1,Math.floor((right-left)/(mobile()?27:32)));
 const rows=Math.ceil(flags.length/cols);
 const cw=(right-left)/cols,ch=(bottom-top)/rows;
 flags.forEach((f,i)=>{
  f.tx=clamp(left+(i%cols)*cw+cw*.5,b.minX,b.maxX);
  f.ty=clamp(top+Math.floor(i/cols)*ch+ch*.5,b.minY,b.maxY);
 });
}

function loadFlag(c){
 const im=new Image();
 im.src="https://flagcdn.com/w80/"+c[1]+".png";
 im.onload=()=>{flagImages[c[1]]=im;};
 im.onerror=()=>{flagImages[c[1]]=null;};
 flagImages[c[1]]=im;
}
countries.forEach(loadFlag);

function makeFlag(c,i){
 const b=getBounds(),cols=10;
 flags.push({
  id:nextId++,name:c[0],code:c[1],
  x:clamp(8+(i%cols)*Math.max(24,Math.min(31,W*.3/cols)),b.minX,b.maxX),
  y:clamp(22+Math.floor(i/cols)*Math.max(12,Math.min(17,H*.59/20)),b.minY,b.maxY),
  tx:0,ty:0,hp:100,alive:true,speed:rand(65,95),
  fire:rand(.05,.7),dx:0,dy:0,dodge:0,idle:0,ix:0,iy:0
 });
}

function makeZombie(x,y){
 const hp=48+Math.min(wave,40)*4;
 zombies.push({
  id:nextId++,x,y,hp,max:hp,
  speed:rand(76,108)+Math.min(wave,45)*1.4,
  alive:true
 });
}

function killFlag(f){
 if(!f.alive)return;
 f.alive=false;
 const item=document.createElement("span");item.className="dead";
 const img=document.createElement("img");
 img.src="https://flagcdn.com/w80/"+f.code+".png";img.alt="";
 const name=document.createElement("span");name.textContent=f.name;
 item.append(img,name);$("deadList").appendChild(item);
 $("deadTitle").textContent="☠ FALLEN FLAGS ("+$("deadList").children.length+")";
 tone(115,.16,.2,"sawtooth",45);
}
function killZombie(z){
 if(!z.alive)return;
 z.alive=false;defeated++;
 tone(240,.055,.08,"square",120);
}

function banner(title,subtitle=""){
 $("banner").firstChild.textContent=title;
 $("subbanner").textContent=subtitle;
 $("subbanner").style.display=subtitle?"block":"none";
}
function hideBannerSoon(ms){
 clearTimeout(lastBannerTimer);
 lastBannerTimer=setTimeout(()=>{
  if(started&&!paused&&!gameOver)$("banner").style.display="none";
 },ms);
}

function reset(){
 cancelAnimationFrame(window.gameFrame);
 clearTimeout(lastBannerTimer);
 flags=[];zombies=[];bullets=[];
 nextId=1;defeated=0;wave=1;waveClock=0;spawnClock=0;
 shotClock=0;statsClock=0;started=false;paused=false;gameOver=false;
 countdown=10;countClock=0;
 $("pause").textContent="⏸ Pause";
 $("deadList").innerHTML="No flags have fallen yet!";
 $("deadTitle").textContent="☠ FALLEN FLAGS (0)";
 $("notice").textContent="🛡️ PREPARATION PHASE";
 $("banner").style.display="block";
 banner("GET READY!","Horde arrives in 10");
 countries.forEach(makeFlag);setTargets();
 running=true;lastTime=performance.now();
 window.gameFrame=requestAnimationFrame(tick);
}

function startBattle(){
 if(started)return;
 started=true;
 $("notice").textContent="⚔️ BATTLE IN PROGRESS";
 banner("NIGHTMARE MODE!","THE HORDE IS COMING!");
 tone(90,.5,.2,"sawtooth",42);
 for(let i=0;i<Math.min(40,maxZombies());i++)
  makeZombie(-rand(0,100),rand(18,Math.max(30,H*.62-20)));
 hideBannerSoon(1600);
}

// The waves are endless. Only simultaneous living zombies are limited,
// with a smaller cap on mobile to avoid freezing the browser.
function maxZombies(){return mobile()?180:420;}
function maxBullets(){return mobile()?100:220;}

function update(dt){
 if(!started){
  countClock+=dt;
  while(countClock>=1&&countdown>0){
   countClock--;countdown--;
   banner("GET READY!","Horde arrives in "+countdown);
  }
  if(countdown<=0)startBattle();
 }
 const livingFlags=flags.filter(f=>f.alive);
 const livingZombies=zombies.filter(z=>z.alive);
 const b=getBounds();

 for(const f of livingFlags){
  if(!started){
   const dx=f.tx-f.x,dy=f.ty-f.y,d=Math.hypot(dx,dy);
   if(d>1){const s=Math.min(d,f.speed*dt);f.x+=dx/d*s;f.y+=dy/d*s;}
  }else{
   let near=null,nd=Infinity;
   // Each flag checks a subset of zombies on mobile to reduce CPU work.
   const stride=mobile()&&livingZombies.length>90?2:1;
   for(let i=(f.id%stride);i<livingZombies.length;i+=stride){
    const z=livingZombies[i],dx=z.x-f.x,dy=z.y-f.y,d2=dx*dx+dy*dy;
    if(d2<nd){nd=d2;near=z;}
   }
   const distance=Math.sqrt(nd);
   if(near&&distance<155){
    let dx=f.x-near.x,dy=f.y-near.y,l=Math.hypot(dx,dy)||1;
    dx/=l;dy/=l;f.dodge-=dt;
    if(f.dodge<=0){
     const side=Math.random()<.5?-1:1;
     f.dx=dx*.65-dy*side*.75+rand(-.2,.2);
     f.dy=dy*.65+dx*side*.75+rand(-.2,.2);
     l=Math.hypot(f.dx,f.dy)||1;f.dx/=l;f.dy/=l;
     f.dodge=rand(.3,.7);
    }
    f.x+=f.dx*135*dt;f.y+=f.dy*135*dt;
   }else{
    f.idle-=dt;
    if(f.idle<=0){
     const dx=f.tx-f.x,dy=f.ty-f.y,l=Math.hypot(dx,dy)||1;
     f.ix=dx/l+rand(-.35,.35);f.iy=dy/l+rand(-.35,.35);
     const n=Math.hypot(f.ix,f.iy)||1;f.ix/=n;f.iy/=n;
     f.idle=rand(.5,1.1);
    }
    const home=Math.hypot(f.tx-f.x,f.ty-f.y);
    if(home>60){
     const dx=f.tx-f.x,dy=f.ty-f.y,l=Math.hypot(dx,dy)||1;
     f.x+=dx/l*42*dt;f.y+=dy/l*42*dt;
    }else{f.x+=f.ix*12*dt;f.y+=f.iy*12*dt;}
   }
   f.x=clamp(f.x,b.minX,b.maxX);f.y=clamp(f.y,b.minY,b.maxY);
  }

  f.fire-=dt;
  if(started&&livingZombies.length&&f.fire<=0&&bullets.length<maxBullets()){
   let target=null,best=Infinity;
   // Search zombies, but stop early if a very close target is found.
   for(const z of livingZombies){
    const dx=z.x-f.x,dy=z.y-f.y,d=dx*dx+dy*dy;
    if(d<best){best=d;target=z;if(d<100)break;}
   }
   if(target){
    const sx=f.x+18,sy=f.y+13,dx=target.x+10-sx,dy=target.y+8-sy;
    const l=Math.hypot(dx,dy)||1;
    bullets.push({x:sx,y:sy,vx:dx/l*540,vy:dy/l*540,damage:rand(38,48),alive:true});
   }
   f.fire=rand(.26,.48);
   if(shotClock<=0){
    tone(155,.065,.25,"sawtooth",58);
    tone(880,.022,.09,"square",240);
    shotClock=.11;
   }
  }
 }

 if(started){
  shotClock=Math.max(0,shotClock-dt);
  spawnClock-=dt;
  if(spawnClock<=0){
   const aliveCount=livingZombies.length;
   if(aliveCount<maxZombies()){
    // More spawn pressure each wave, without flooding the device.
    const amount=Math.min(1+Math.floor(wave/2),maxZombies()-aliveCount, mobile()?5:10);
    for(let i=0;i<amount;i++)
     makeZombie(-rand(0,35),rand(15,Math.max(28,H*.62-18)));
   }
   spawnClock=Math.max(mobile()?.12:.065,.38-Math.min(wave,30)*.009);
  }

  for(const z of zombies){
   if(!z.alive)continue;
   let target=null,best=Infinity;
   for(const f of livingFlags){
    const dx=f.x-z.x,dy=f.y-z.y,d=dx*dx+dy*dy;
    if(d<best){best=d;target=f;}
   }
   if(target){
    const dx=target.x-z.x,dy=target.y-z.y,l=Math.hypot(dx,dy)||1;
    z.x+=dx/l*z.speed*dt;z.y+=dy/l*z.speed*dt;
    if(Math.abs(z.x-target.x)<23&&Math.abs(z.y-target.y)<18){
     target.hp-=(95+Math.min(wave,30)*5)*dt;
     if(target.hp<=0){
      killFlag(target);
      const idx=livingFlags.indexOf(target);
      if(idx!==-1)livingFlags.splice(idx,1);
     }
    }
   }
   z.x=clamp(z.x,-24,W-24);
   z.y=clamp(z.y,12,H*.65-18);
  }

  // Swept bullet hitboxes prevent fast bullets passing through zombies.
  for(const b of bullets){
   if(!b.alive)continue;
   const ox=b.x,oy=b.y;
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   let hit=null;
   for(const z of zombies){
    if(!z.alive)continue;
    // Segment-to-rectangle clipping.
    const dx=b.x-ox,dy=b.y-oy;
    let t0=0,t1=1,hitRect=true;
    const ps=[-dx,dx,-dy,dy];
    const qs=[ox-(z.x-4),(z.x+25)-ox,oy-(z.y-3),(z.y+20)-oy];
    for(let k=0;k<4;k++){
     if(Math.abs(ps[k])<1e-8){if(qs[k]<0){hitRect=false;break;}}
     else{
      const r=qs[k]/ps[k];
      if(ps[k]<0){if(r>t1){hitRect=false;break;}if(r>t0)t0=r;}
      else{if(r<t0){hitRect=false;break;}if(r<t1)t1=r;}
     }
    }
    if(hitRect){hit=z;break;}
   }
   if(hit){
    hit.hp-=b.damage;b.alive=false;
    tone(310,.025,.035,"square",180);
    if(hit.hp<=0)killZombie(hit);
   }else if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30)b.alive=false;
  }

  bullets=bullets.filter(b=>b.alive);
  zombies=zombies.filter(z=>z.alive);

  waveClock+=dt;
  if(waveClock>=10){
   waveClock-=10;wave++;
   $("notice").textContent="⚔️ WAVE "+wave;
   banner("WAVE "+wave,"ENDLESS HORDE! Spawn rate increasing!");
   tone(420,.15,.08,"triangle",700);
   hideBannerSoon(1000);
  }
 }

 statsClock-=dt;
 if(statsClock<=0){
  statsClock=.25;
  $("stats").textContent=started
   ?"Wave "+wave+" · 🧟 "+zombies.length+" active · ☠ "+defeated+" defeated · 🌍 "+livingFlags.length+" flags"
   :"🌍 "+livingFlags.length+" flags preparing · "+countdown+"s";
 }
 if(started&&livingFlags.length===0){
  banner("ZOMBIES WIN!","All flags have fallen");
  $("notice").textContent="BATTLE OVER";running=false;gameOver=true;
 }
}

function draw(){
 // Background
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#142b3c");sky.addColorStop(.67,"#263e43");
 sky.addColorStop(.68,"#5a6241");sky.addColorStop(1,"#3e4d34");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#a5a16d";ctx.fillRect(0,H*.68,W,3);
 ctx.globalAlpha=.14;ctx.strokeStyle="#d5dfb4";ctx.lineWidth=1;
 for(let x=-H;x<W;x+=42){ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+H*.5,H*.68);ctx.stroke();}
 ctx.globalAlpha=1;

 // Bullets first, so they appear behind units.
 for(const b of bullets){
  ctx.fillStyle="#ffe58a";ctx.shadowColor="#ffed8b";ctx.shadowBlur=5;
  ctx.fillRect(b.x,b.y,8,3);
 }
 ctx.shadowBlur=0;

 const fw=mobile()?23:27,fh=mobile()?15:18;
 for(const f of flags){
  if(!f.alive)continue;
  const im=flagImages[f.code];
  if(im&&im.complete&&im.naturalWidth){
   ctx.drawImage(im,f.x,f.y,fw,fh);
  }else{
   ctx.fillStyle="#f5f5f5";ctx.fillRect(f.x,f.y,fw,fh);
   ctx.fillStyle="#e33";ctx.fillRect(f.x,f.y,fw,fh/3);
  }
  // Tiny rifle
  ctx.fillStyle="#252c32";ctx.fillRect(f.x+fw*.56,f.y+fh*.72,12,3);
  ctx.fillStyle="#c6d1d7";ctx.fillRect(f.x+fw*.56+9,f.y+fh*.72,6,1.5);
  if(f.hp<100){
   ctx.fillStyle="#62242a";ctx.fillRect(f.x,f.y-4,fw,2);
   ctx.fillStyle="#76ff68";ctx.fillRect(f.x,f.y-4,fw*clamp(f.hp/100,0,1),2);
  }
 }
 for(const z of zombies){
  ctx.fillStyle="#19c63f";ctx.fillRect(z.x,z.y,23,17);
  ctx.strokeStyle="#8aff8b";ctx.lineWidth=2;ctx.strokeRect(z.x,z.y,23,17);
  ctx.fillStyle="#62242a";ctx.fillRect(z.x,z.y-5,23,3);
  ctx.fillStyle="#76ff68";ctx.fillRect(z.x,z.y-5,23*clamp(z.hp/z.max,0,1),3);
 }
}

function tick(now){
 if(!running)return;
 if(paused){
  lastTime=now;draw();
  window.gameFrame=requestAnimationFrame(tick);return;
 }
 const dt=Math.min(.035,Math.max(0,(now-lastTime)/1000));
 lastTime=now;
 update(dt);draw();
 if(running)window.gameFrame=requestAnimationFrame(tick);
}

$("pause").addEventListener("click",()=>{
 if(gameOver)return;
 paused=!paused;
 $("pause").textContent=paused?"▶ Resume":"⏸ Pause";
 if(paused){
  $("notice").textContent="⏸ GAME PAUSED";
  $("banner").style.display="block";banner("PAUSED","Press Resume to continue");
 }else{
  $("notice").textContent=started?"⚔️ BATTLE IN PROGRESS":"🛡️ PREPARATION PHASE";
  $("banner").style.display=started?"none":"block";
  lastTime=performance.now();
 }
});
$("restart").addEventListener("click",()=>{setupAudio();reset();});
$("sound").addEventListener("click",()=>{
 muted=!muted;
 $("sound").textContent=muted?"🔇 Sound OFF":"🔊 Sound ON";
 if(!muted){setupAudio();tone(500,.12,.12,"triangle",700);}
});
$("fullscreen").addEventListener("click",async()=>{
 setupAudio();
 try{
  if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
  else await document.exitFullscreen();
 }catch(e){banner("FULLSCREEN UNAVAILABLE","Try your browser's fullscreen option");hideBannerSoon(1600);}
});
document.addEventListener("visibilitychange",()=>{
 lastTime=performance.now();
 if(document.hidden&&running&&!paused){
  paused=true;$("pause").textContent="▶ Resume";
  $("notice").textContent="⏸ AUTO-PAUSED";
  $("banner").style.display="block";banner("PAUSED","Tab hidden — resume when ready");
 }
});

resize();
reset();
</script>
</body>
</html>
